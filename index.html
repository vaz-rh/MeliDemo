<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Mercado Livre</title>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="search-container">
                <img alt="logo-mercado-livre" class="logo" src="https://http2.mlstatic.com/D_NQ_NP_880958-MLA85125228867_052025-F.jpg">
                <input type="text" id="searchInput" placeholder="Buscar produtos..." class="search-input">
                <button id="searchBtn" class="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </header>
    <section class="hero">
        <h1>Ofertas Imperdíveis</h1>
        <p>Encontre os melhores produtos com os melhores preços!</p>
    </section>
        
    
    <main class="main">
        <div class="container">
            <h2 class="main-title">Produtos em Destaque</h2>
            <div class="products-grid" id="productsGrid">
                <!-- PRODUTOS - SERÃO INSERIDOS AQUI DINAMICAMENTE -->
                   
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Mercado Livre. Todos os direitos reservados.</p>
        </div>
    </footer>    
        
    <script src="script.js"></script>
</body>
</html>
